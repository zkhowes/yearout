ccent),0 0 0 47px currentColor,0 0 0 70px var(--yr-accent),0 0 0 71px currentColor;transform:rotate(-25deg)} #year-exploration .yr-hero-bottom{position:relative;display:flex;justify-content:space-between;align-items:end;margin-top:35px;font-size:13px} #year-exploration .yr-count{font-size:33px;letter-spacing:-1px;line-height:1} #year-exploration .yr-count small{display:block;font:11px/1.6 -apple-system,sans-serif;letter-spacing:0} #year-exploration .yr-action{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 0!important;border-bottom:1px solid var(--yr-line)!important;text-align:left} #year-exploration .yr-action strong{display:block;font-size:15px} #year-exploration .yr-action small{display:block;color:var(--yr-muted);font-size:12px;margin-top:3px} #year-exploration .yr-primary,#year-exploration .yr-done{width:100%;background:var(--yr-accent)!important;color:var(--yr-ink)!important;min-height:50px!important;font-weight:650!important;border-radius:12px;margin-top:19px;padding:12px!important} #year-exploration .yr-section{display:flex;justify-content:space-between;align-items:center;margin:23px 0 12px;font-size:13px} #year-exploration .yr-avatars{display:flex;align-items:center} #year-exploration .yr-avatar{display:inline-grid;place-items:center;width:34px;height:34px;margin-right:-5px;border:2px solid var(--yr-bg);border-radius:50%;background:var(--yr-panel);color:var(--yr-fg);font-size:11px;font-weight:650} #year-exploration .yr-avatars small{margin-left:14px;color:var(--yr-muted);font-size:12px} #year-exploration .yr-nav{display:flex;justify-content:space-around;border-top:1px solid var(--yr-line);padding:10px 10px 0;background:var(--yr-bg)} #year-exploration .yr-nav button{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:58px;color:var(--yr-muted);font-size:11px} #year-exploration .yr-nav button[aria-pressed="true"]{color:var(--yr-fg);font-weight:750} #year-exploration .yr-nav button[aria-pressed="true"] svg{background:var(--yr-accent);color:var(--yr-ink);border-radius:5px;outline:4px solid var(--yr-accent)} #year-exploration .yr-home{height:27px;display:grid;place-items:center} #year-exploration .yr-home span{height:4px;width:110px;border-radius:5px;background:var(--yr-fg)}

-items:end} #year-exploration .yr-overlay[hidden]{display:none} #year-exploration .yr-sheet{width:100%;padding:22px 22px 34px;background:var(--yr-bg);border-radius:26px 26px 0 0} #year-exploration .yr-sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px} #year-exploration .yr-sheet-head h2{font-size:22px;letter-spacing:-.5px} #year-exploration .yr-close{min-width:44px} #year-exploration .yr-option{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px!important;border:1px solid var(--yr-line)!important;border-radius:13px;margin-top:9px} #year-exploration .yr-option[aria-pressed="true"]{border:2px solid var(--yr-fg)!important} #year-exploration .yr-swatch{width:42px;height:48px;border-radius:6px;display:grid;place-items:center;font-size:21px;font-weight:700} #year-exploration .yr-option small{display:block;color:var(--yr-muted);font-size:12px;margin-top:2px} #year-exploration .yr-feedback{font-size:13px;padding:12px 0;color:var(--yr-muted)}

<script>
(()=>{
 const root=document.getElementById('year-exploration'), phone=root.querySelector('.yr-phone'), main=root.querySelector('.yr-content'), overlay=root.querySelector('.yr-overlay');
 const state={direction:'poster',style:'circuit',page:'trip'};
 const styles={circuit:{name:'Circuit',desc:'Alpine graphite · acid yellow',bg:'#182215',accent:'#dcfa72'},club:{name:'Club',desc:'Sailing blue · porcelain · serif',bg:'#203f53',accent:'#bfe6f2'},trail:{name:'Trail',desc:'Moss · lichen · field guide',bg:'#273c29',accent:'#ced674'},getaway:{name:'Getaway',desc:'Berry · pink · sun-faded warmth',bg:'#592737',accent:'#f8b5c8'}};
 const avatars='<div class="yr-avatars"><span class="yr-avatar">ZK</span><span class="yr-avatar">AM</span><span class="yr-avatar">JT</span><span class="yr-avatar">RS</span><small>8 in · 2 deciding</small></div>';
 const action='<button class="yr-action" data-action="travel"><span><strong>Your travel is next</strong><small>Add your flight so the crew can coordinate.</small></span><span>↗</span></button>';
 function render(){
 phone.dataset.direction=state.direction;phone.dataset.style=state.style;
 root.querySelectorAll('[data-direction]').forEach(b=>{if(b.tagName==='BUTTON'){const selected=b.dataset.direction===state.direction;b.classList.toggle('active',selected);b.setAttribute('aria-selected',String(selected));if(selected)root.querySelector('#year-preview').setAttribute('aria-labelledby',b.id)}});
 root.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===state.page)));
 let content='';
 if(state.page==='trip'&&state.direction==='poster')content='<div class="yr-eyebrow yr-muted">The Torture Tour · Est. 2014</div><h1 class="yr-title">SAME CREW.<br>NEW ALTITUDE.</h1><section class="yr-hero"><div class="yr-eyebrow">Next up / 2027</div><div class="yr-graphic" aria-hidden="true"></div><h2 class="yr-destination">REVEL<br>STOKE.</h2><div class="yr-hero-bottom"><span>British Columbia<br>Feb 18–22 · Dates locked</span><div class="yr-count">166<small>days to go</small></div></div></section><div class="yr-section"><strong>The usual suspects</strong><span class="yr-muted">10 invited</span></div>'+avatars+action;
 if(state.page==='trip'&&state.direction==='journal')content='<div class="yr-journal-head"><div class="yr-eyebrow yr-muted">The Torture Tour / Since 2014</div><h1 class="yr-title">A little further.<br>Every year.</h1><span class="yr-muted">Good trips become great stories.</span></div><div class="yr-ticket"><div class="yr-date">18<small>Feb 2027</small></div><div><div class="yr-eyebrow yr-muted">The next chapter</div><h2 style="font:28px/1.3 Georgia,serif;margin:4px 0">Revelstoke</h2><span class="yr-muted">Five days. Ten old friends.</span></div></div><div class="yr-section"><strong>Coming along</strong><span class="yr-muted">8 confirmed</span></div>'+avatars+action+'<section class="yr-note"><div class="yr-eyebrow yr-muted">From the archive · 2025</div><p class="yr-quote">“One more run” was never just one more run.</p><span class="yr-muted" style="font-size:12px">Fernie · A story worth keeping</span></section>';
 if(state.page==='trip'&&state.direction==='social')content='<div class="yr-eyebrow yr-muted">The Torture Tour</div><h1 class="yr-social-title">Something to<br>look forward to.</h1><section class="yr-social-trip"><div class="yr-eyebrow">It’s happening · 2027</div><h2>Revelstoke<br>with your people.</h2><p>Feb 18–22 · 166 days away</p><button class="yr-primary" data-action="travel">Add your travel ↗</button></section><div class="yr-section"><strong>The crew is coming together</strong></div>'+avatars+'<article class="yr-post"><div class="yr-post-head"><span class="yr-avatar">AM</span><span><strong>Alex</strong><br><span class="yr-muted">All booked · Today</span></span></div><p>Flights booked. Who’s sharing a ride from Kelowna?</p><button class="yr-action" data-action="ride"><span>See crew travel</span><span>↗</span></button></article>';
 if(state.page==='crew')content='<div class="yr-eyebrow yr-muted">Revelstoke / 2027</div><h1 class="yr-title">The usual<br>suspects.</h1><p class="yr-muted">8 confirmed · 2 still deciding</p>'+[['ZK','Zach','Host · All booked'],['AM','Alex','All booked · Arrives Feb 18'],['JT','Jamie','In · Booking travel'],['RS','Riley','In · Booking travel'],['CH','Chris','Still deciding']].map(x=>'<div class="yr-post-head yr-post"><span class="yr-avatar">'+x[0]+'</span><span><strong>'+x[1]+'</strong><br><span class="yr-muted">'+x[2]+'</span></span></div>').join('');
 if(state.page==='lore')content='<div class="yr-eyebrow yr-muted">The Torture Tour / Lore</div><h1 class="yr-title">You had<br>to be there.</h1><section class="yr-note"><div class="yr-eyebrow">Hall of fame · Fernie 2025</div><p class="yr-quote">“One more run” was never just one more run.</p><p class="yr-muted">Jamie · Day 3</p></section><article class="yr-post"><div class="yr-post-head"><span class="yr-avatar">RS</span><span><strong>Riley</strong><br><span class="yr-muted">Revelstoke 2024</span></span></div><p>We still talk about the breakfast that lasted until lunch.</p></article><button class="yr-primary" data-action="memory">＋ Add a memory</button>';
 if(state.page==='years')content='<div class="yr-eyebrow yr-muted">The Torture Tour / Archive</div><h1 class="yr-title">A year.<br>A whole story.</h1>'+[['2026','Whitefish','9 crew · Montana'],['2025','Fernie','10 crew · British Columbia'],['2024','Revelstoke','8 crew · British Columbia'],['2023','Jackson Hole','9 crew · Wyoming']].map(x=>'<div class="yr-year-row"><span class="yr-year-num">'+x[0]+'</span><div><strong>'+x[1]+'</strong><small>'+x[2]+'</small></div></div>').join('');
 main.innerHTML=content;
 root.querySelector('.yr-options').innerHTML=Object.entries(styles).map(([key,s])=>'<button class="yr-option" data-choice="'+key+'" aria-pressed="'+(key===state.style)+'"><span class="yr-swatch" style="background:'+s.accent+';color:'+s.bg+'">Aa</span><span><strong>'+s.name+'</strong><small>'+s.desc+'</small></span></button>').join('');
 if(globalThis.lucide)lucide.createIcons();
 }
 function close(){overlay.hidden=true;main.inert=false;root.querySelector('.yr-header').inert=false;root.querySelector('.yr-nav').inert=false;root.querySelector('.yr-style').focus()}
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.direction){state.direction=b.dataset.direction;render()}if(b.dataset.page){state.page=b.dataset.page;render()}if(b.classList.contains('yr-wordmark')){state.page='trip';render()}if(b.classList.contains('yr-style')){overlay.hidden=false;main.inert=true;root.querySelector('.yr-header').inert=true;root.querySelector('.yr-nav').inert=true;root.querySelector('.yr-close').focus()}if(b.dataset.choice){state.style=b.dataset.choice;render();root.querySelector('[data-choice="'+state.style+'"]').focus()}if(b.classList.contains('yr-close')||b.classList.contains('yr-done'))close();if(b.dataset.action==='ride'){state.page='crew';render()}if(b.dataset.action==='travel'||b.dataset.action==='memory'){const memory=b.dataset.action==='memory';main.innerHTML='<div class="yr-eyebrow yr-muted">Revelstoke / 2027</div><h1 class="yr-social-title">'+(memory?'Keep this one.':'Meet you there.')+'</h1><form class="yr-demo-form"><label style="display:block;margin:20px 0">'+(memory?'Your memory':'Airline and flight number')+'<input required aria-label="'+(memory?'Your memory':'Airline and flight number')+'" style="display:block;width:100%;margin-top:10px;padding:14px;border:1px solid var(--yr-line);border-radius:10px;background:var(--yr-panel);color:var(--yr-fg);font:16px -apple-system,sans-serif" placeholder="'+(memory?'What happened?':'e.g. AC 8392')+'"></label><button class="yr-primary" type="submit">Save preview</button><p class="yr-feedback">Demo only · Nothing is sent or saved to your account.</p></form>';main.querySelector('form').addEventListener('submit',ev=>{ev.preventDefault();main.querySelector('.yr-feedback').textContent='Preview saved for this screen.';main.querySelector('.yr-feedback').setAttribute('role','status')})}});
 root.addEventListener('keydown',e=>{if(!overlay.hidden&&e.key==='Escape')close();if(!overlay.hidden&&e.key==='Tab'){const items=[...overlay.querySelectorAll('button')],first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
 render();
 if(globalThis.Tweak){const tweak=new Tweak({container:phone,onChange:render});tweak.addSelect(state,'style',{label:'Ritual style',options:Object.keys(styles)});tweak.addSelect(state,'direction',{label:'Design direction',options:[{label:'Expedition',value:'poster'},{label:'Fieldnotes',value:'journal'},{label:'Common ground',value:'social'}]})}
})();
</script>
